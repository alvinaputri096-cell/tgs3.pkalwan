
name: Build C++ EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile C++ to EXE
        shell: msys2 {0}
        run: |
          g++ main.cpp -o program.exe -static -std=c++17

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Program-EXE
          path: program.exe
